<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Gestor de Biblioteca</h1>

    <h2>Lista de Libros</h2>
<ul>
    {% for libro in libros %}
    <li>
        {{ libro.titulo }} - {{ libro.autor }} ({{ libro.anio }})
        <a href="{{ url_for('routes.editar_libro', id=libro.id) }}">Editar</a> |
        <a href="{{ url_for('routes.eliminar_libro', id=libro.id) }}">Eliminar</a>

    </li>
    {% endfor %}
</ul>


    <h2>Agregar Libro</h2>
    <form action="{{ url_for('routes.agregar_libro') }}" method="POST">
        <input type="text" name="titulo" placeholder="Título" required><br>
        <input type="text" name="autor" placeholder="Autor" required><br>
        <input type="text" name="categoria" placeholder="Categoría"><br>
        <input type="number" name="anio" placeholder="Año"><br>
        <textarea name="descripcion" placeholder="Descripción"></textarea><br>
        <button type="submit" class="btn btn-success">Agregar</button>
    </form>
</body>
</html>
