<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Editar Libro</h1>
    <form action="{{ url_for('routes.editar_libro', id=libro.id) }}" method="POST">
        <input type="text" name="titulo" value="{{ libro.titulo }}" required><br>
        <input type="text" name="autor" value="{{ libro.autor }}" required><br>
        <input type="text" name="categoria" value="{{ libro.categoria }}"><br>
        <input type="number" name="anio" value="{{ libro.anio }}"><br>
        <textarea name="descripcion">{{ libro.descripcion }}</textarea><br>
        <button type="submit" class="btn btn-success">Guardar cambios</button>
    </form>
    <a href="{{ url_for('routes.index') }}">Volver</a>
</body>
</html>
